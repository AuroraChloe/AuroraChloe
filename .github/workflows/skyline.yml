name: GitHub Skyline

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  skyline:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - name: GitHub Skyline
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.plugin.skyline.svg
          token: NOT_NEEDED
          base: ""
          plugin_skyline: yes
          plugin_skyline_year: 2026
          plugin_skyline_frames: 30
          plugin_skyline_quality: 0.2
